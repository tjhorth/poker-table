services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP in (from OBS)
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS out (browser, VLC)
      - "8889:8889"   # WebRTC out (low latency)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
