services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      # - mosquitto-log:/mosquitto/log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mosquitto-data:
  # mosquitto-log:
