<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./css/output.css" rel="stylesheet" />
    <link href="./css/index.css" rel="stylesheet" />
    <title>TCT Poker LiveStream</title>
</head>
<body class="dark:">
    <h1 class="bg-amber-500 text-shadow-mauve-500">Hello!</h1>
    <div class="top-bar">
        <div>Live</div>
        <div>Hand #</div>
        <div>Game Style</div>
    </div>
    <div>
        <div class="seats">
            <button type="button" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded transition duration-200">SEAT 1</button>
            <button type="button">SEAT 2</button>
            <div>seat 3</div>
            <div>seat 4</div>
            <div>seat 5</div>
            <div>seat 6</div>
            <div>seat 7</div>
            <div>seat 8</div>
        </div>
        <div class="hand-control">
            <div>Action</div>
            <div>Pot</div>
            <div>Street</div>
            <button>Next Hand</button>
        </div>
    </div>
    <nav>
        <div>Hand</div>
        <div>Seats</div>
        <div>Setup (PIN)</div>
        <div>Stream</div>
    </nav>
</body>
</html>
