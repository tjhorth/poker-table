<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Poker overlay</title>
<!--
  Stream overlay. Add as an OBS Browser Source (any size; it scales with the
  height of the source: 1280x720, 1920x1080, ...).

  URLs
    index.html                                  demo: plays a scripted hand loop
    index.html?bg=1                             demo over a grey backdrop (browser preview)
    index.html?ws=ws://HOST:8000/ws/overlay     live: events from the engine

  Events (JSON, one object or an array of objects per WebSocket message)

    {"type":"hand_start", "hand":42, "game":"nlh", "blinds":"1/2", "button":8,
     "players":[{"seat":1,"name":"Maya","stack":412}, ... ],
     "order":[1,2,3,4,5,6,7,8],      // optional; default = seats clockwise
     "pot":0 }                       //   starting with the small blind
        Starts a hand. Tiles stay hidden until the first hole cards register.
        game = nlh | plo4 | bomb_plo_2brd, or any text to show as-is
               ("NLH", "PLO 4-card", "Bomb Pot - 2brd PLO").

    {"type":"cards", "seat":3, "cards":["Ah","Kh"]}
        Hole cards registered for a seat. The first one of the hand makes all
        tiles phase in; each seat's cards then appear as they register.

    {"type":"blind", "seat":1, "kind":"SB", "amount":1, "stack":411, "pot":1}
    {"type":"turn",  "seat":3}
        Moves the "on action" highlight.
    {"type":"action","seat":3, "action":"raise", "amount":6, "stack":524, "pot":9}
        action = check | call | bet | raise | all_in | fold
        amount = what to show on the label (the bet "to" amount)
        "fold" drops the label, then greys the tile out and slides it away.
    {"type":"street","street":"flop","board":["As","Kd","7c"],"pots":[54]}
        Clears the action labels and reveals the community cards. Send it once
        every card of the street is registered: the cards then appear one after
        another in a waterfall, right side of the screen, vertically centred.
        For a double board game send
        "boards":[["As","Kd","7c"],["2h","9d","Jc"]] instead; the second board
        cascades in after the first.

    {"type":"equity","equities":{"3":62.4,"5":37.6},"outs":{"5":["Kh","Th","9h"]}}
        Win chance per seat (percent, shown on each tile) and, for seats that
        are behind, the next cards that would put them in the lead. A seat's outs
        are shown at the bottom centre of the screen while it is that seat's turn.

  Pots: any event may carry "pots":[main, side1, side2, ...] (or the older
  single "pot":N). One entry shows "Pot"; several show "Main Pot" and
  "Side Pot 1", "Side Pot 2", ... New side pots drop in as they are created.
  An entry is a number, or {"amount":200,"eligible":[2,5,7]} to also list who
  can win that pot (seat numbers, folded players left out). The eligible line
  is shown whenever there is more than one pot.

  Hole cards: 2 for NLH, 4 for PLO and bomb-pot PLO (taken from the game name),
  or set "hole_cards":N on hand_start. Send all of a seat's cards in one
  "cards" event.

    {"type":"next_hand","winners":[{"seat":2,"amount":260,"stack":672}]}
        The dealer pressed Next Hand. Each winner's stack counts up by "amount"
        over 2 s ("+$..." in neon green), holds the final value in bright green
        for 2 s, then the remaining tiles are discarded top to bottom like a
        waterfall. The next hand_start waits until all of that has finished.

  Everything except "cards" is played one at a time: each event waits for the
  previous animation to finish. Cards: rank A K Q J T 9..2 + suit s h d c.
-->
<style>
  /* 1rem = 16px at 720px height; everything is in rem so it scales with the source */
  html { font-size: 2.2222vh; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent;
               font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #fff; }
  body.preview, html.preview { background: #2b3a2f; }

  .bar { position: absolute; background: rgba(0,0,0,.65); border-radius: .75rem; padding: .5rem 1.1rem; }
  #info { top: 1rem; left: 9rem; font-size: 1.4rem; white-space: nowrap; }
  #pots { position: absolute; top: 1rem; right: 1rem; display: flex; flex-direction: column;
          align-items: flex-end; gap: .4rem; }
  .pot-bar { background: rgba(0,0,0,.65); border-radius: .75rem; padding: .5rem 1.1rem;
             font-size: 1.75rem; font-weight: 600; white-space: nowrap;
             display: flex; flex-direction: column; align-items: flex-end; }
  .pot-bar.side { font-size: 1.2rem; padding: .35rem .9rem; background: rgba(0,0,0,.55); }
  .pot-elig { font-size: .62rem; font-weight: 500; line-height: 1.3; margin-top: .1rem;
              color: #b0bec5; white-space: normal; text-align: right; max-width: 18rem; }
  #board { position: absolute; top: 50%; right: 1rem; transform: translateY(-50%);
           display: flex; flex-direction: column; align-items: flex-end; gap: .45rem; }
  .board-row { display: flex; justify-content: flex-end; gap: .3rem; }

  #seats { position: absolute; top: .5rem; left: .75rem; display: flex; flex-direction: column; gap: .25rem; }
  .slot  { width: 7.4rem; }
  .seat  { box-sizing: border-box; background: rgba(0,0,0,.72); border: .12rem solid transparent;
           border-radius: .6rem; padding: .2rem .4rem; text-align: center; transition: border-color .25s; }
  .seat.active { border-color: #ffd54a; }
  /* A label is attached underneath: square off the tile's bottom corners so
     the two read as one shape with no gap at the curve. */
  .seat.joined { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .cards { display: flex; gap: .2rem; justify-content: center; height: 1.6rem; }
  .card  { width: 1.15rem; height: 1.6rem; box-sizing: border-box; border-radius: .22rem;
           background: #fff; color: #111; display: flex; flex-direction: column;
           align-items: center; justify-content: center;
           font-size: .62rem; font-weight: 700; line-height: 1.05; }
  .card.red   { color: #c62828; }
  .card.empty { background: transparent; border: .1rem dashed rgba(255,255,255,.25); }
  .name  { font-size: .75rem; font-weight: 600; line-height: 1.15; margin-top: .12rem;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .money-row { display: flex; justify-content: center; align-items: baseline; gap: .4rem; }
  .stack { font-size: .7rem; line-height: 1.1; color: #9be59b; }
  .equity { font-size: .7rem; line-height: 1.1; font-weight: 700; color: #90caf9; }
  .equity.lead { color: #ffd54a; }
  .stack.winning { color: #39ff14; font-weight: 700; text-shadow: 0 0 .45rem rgba(57,255,20,.85); }

  .label-clip { height: .95rem; overflow: hidden; }
  .label { height: .95rem; line-height: .95rem; text-align: center; font-size: .62rem;
           font-weight: 700; letter-spacing: .03em; border-radius: 0 0 .6rem .6rem; }
  .label.check { background: #546e7a; }
  .label.call  { background: #1565c0; }
  .label.bet, .label.raise { background: #ef6c00; }
  .label.allin { background: #c62828; }
  .label.fold  { background: #455a64; color: #cfd8dc; }
  .label.blind { background: #6a1b9a; }

  #board .card { width: 2.3rem; height: 3.2rem; font-size: 1.2rem; border-radius: .35rem; }
  #outs { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%);
          display: flex; flex-direction: column; align-items: center; gap: .4rem; max-width: 36rem; }
  .outs-title { background: rgba(0,0,0,.72); border-radius: .6rem; padding: .3rem .9rem;
                font-size: 1rem; font-weight: 600; white-space: nowrap; }
  .outs-row { display: flex; flex-wrap: wrap; justify-content: center; gap: .3rem; }
  #outs .card { width: 1.7rem; height: 2.4rem; font-size: .95rem; border-radius: .3rem; }

  /* Tall, narrow canvases: drop the pots below the header bar so they can't collide. */
  @media (max-aspect-ratio: 4/3) { #pots { top: 4rem; } }
</style>
</head>
<body>
  <div id="info" class="bar"></div>
  <div id="pots"></div>
  <div id="board"></div>
  <div id="seats"></div>
  <div id="outs"></div>

<script>
const params = new URLSearchParams(location.search);
if (params.get('bg')) {
  document.documentElement.classList.add('preview');
  document.body.classList.add('preview');
}

// ---- timing (ms) -----------------------------------------------------
const PHASE_IN_MS = 400;   // all tiles appear
const CARDS_MS    = 350;   // one seat's cards appear
const LABEL_MS    = 500;   // action / blind label drops down
const TURN_MS     = 250;   // highlight moves
const FOLD_MS     = 700;   // grey out, slide right, fade
const MOVE_MS     = 450;   // tiles slide up
const BOARD_MS    = 400;   // one community card lands
const BOARD_STAGGER_MS = 150;   // gap between cards in the waterfall
const PAYOUT_MS   = 2000;  // winner's stack counts up
const HOLD_MS     = 2000;  // final stack stays bright green
const WATERFALL_MS = 140;  // delay between tiles leaving at the end of a hand

const SUITS = { s: '♠', h: '♥', d: '♦', c: '♣' };
const LABELS = {
  check: ['CHECK', 'check'], call: ['CALL', 'call'], bet: ['BET', 'bet'],
  raise: ['RAISE', 'raise'], all_in: ['ALL-IN', 'allin'], fold: ['FOLD', 'fold'],
};
const GAMES = { nlh: 'NLH', plo4: 'PLO 4-card', bomb_plo_2brd: 'Bomb Pot - 2brd PLO' };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);
const els = { info: $('info'), pots: $('pots'), board: $('board'), seats: $('seats'), outs: $('outs') };

// ---- state -----------------------------------------------------------
let epoch = 0;                 // bumped on each new hand; stale work is dropped
let chain = Promise.resolve(); // the one-at-a-time animation queue
let tilesShown = false;
let tilesReady = Promise.resolve();
let resolveTiles = () => {};
const S = { hand: 0, game: 'NLH', blinds: '', street: 'preflop', pots: [0], holes: 2, order: [], players: new Map(), equity: {}, outs: {}, turnSeat: null };

// ---- building blocks ---------------------------------------------------
function cardEl(code) {
  const el = document.createElement('div');
  if (!code) { el.className = 'card empty'; return el; }
  const suit = code[1];
  el.className = 'card' + (suit === 'h' || suit === 'd' ? ' red' : '');
  const rank = document.createElement('span');
  rank.textContent = code[0] === 'T' ? '10' : code[0];
  const s = document.createElement('span');
  s.textContent = SUITS[suit];
  el.append(rank, s);
  return el;
}

function renderInfo() {
  const street = S.street.charAt(0).toUpperCase() + S.street.slice(1);
  els.info.textContent = `${S.game}  ·  Blinds ${S.blinds}  ·  Hand #${S.hand}  ·  ${street}`;
}

// One bar per pot: "Pot", or "Main Pot" plus "Side Pot 1", "Side Pot 2", ...
// With several pots, each also lists who is eligible to win it.
function setPots(items) {
  const list = (items.length ? items : [0])
    .map(x => (typeof x === 'number' ? { amount: x } : x));
  list.forEach((pot, i) => {
    let bar = els.pots.children[i];
    if (!bar) {
      bar = document.createElement('div');
      els.pots.append(bar);
      if (i > 0) {   // a new side pot drops in
        bar.animate([{ opacity: 0, transform: 'translateY(-.7rem)' }, { opacity: 1, transform: 'translateY(0)' }],
                    { duration: 350, easing: 'ease-out' });
      }
    }
    bar.className = 'pot-bar' + (i > 0 ? ' side' : '');
    const name = list.length === 1 ? 'Pot' : i === 0 ? 'Main Pot' : `Side Pot ${i}`;
    const head = document.createElement('div');
    head.textContent = `${name} 💰: $${pot.amount}`;
    bar.replaceChildren(head);
    if (list.length > 1 && pot.eligible && pot.eligible.length) {
      const who = document.createElement('div');
      who.className = 'pot-elig';
      who.textContent = 'Eligible: ' + pot.eligible
        .map(seat => (S.players.get(seat) || {}).name || 'Seat ' + seat).join(', ');
      bar.append(who);
    }
  });
  while (els.pots.children.length > list.length) els.pots.lastChild.remove();
  S.pots = list;
}
const setPot = v => setPots([v]);
function applyPot(ev) {
  if (ev.pots) setPots(ev.pots);
  else if (ev.pot !== undefined) setPot(ev.pot);
}

function makeSlot(p) {
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.style.opacity = '0';
  const seat = document.createElement('div');
  seat.className = 'seat';
  const cards = document.createElement('div');
  cards.className = 'cards';
  cards.append(...Array.from({ length: S.holes }, () => cardEl(null)));
  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = p.name || 'Seat ' + p.seat;
  const stack = document.createElement('div');
  stack.className = 'stack';
  stack.textContent = '$' + p.stack;
  const equity = document.createElement('span');
  equity.className = 'equity';
  const money = document.createElement('div');
  money.className = 'money-row';
  money.append(stack, equity);
  seat.append(cards, name, money);
  const clip = document.createElement('div');
  clip.className = 'label-clip';
  slot.append(seat, clip);
  Object.assign(p, { slot, seatEl: seat, cardsEl: cards, stackEl: stack, equityEl: equity, clip, inColumn: true });
  return slot;
}

function setStack(p, value) {
  if (value === undefined) return;
  p.stack = value;
  p.stackEl.textContent = '$' + value;
}

// Drops a coloured label down from under the tile. Resolves when it has landed.
function dropLabel(p, text, cls) {
  const label = document.createElement('div');
  label.className = 'label ' + cls;
  label.textContent = text;
  p.seatEl.classList.add('joined');
  p.clip.replaceChildren(label);
  return label.animate(
    [{ transform: 'translateY(-100%)' }, { transform: 'translateY(0)' }],
    { duration: LABEL_MS, easing: 'cubic-bezier(.2,.9,.3,1.2)' }
  ).finished;
}

function clearLabels() {
  const waits = [];
  for (const p of S.players.values()) {
    const label = p.clip && p.clip.firstChild;
    if (label) {
      waits.push(label.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250 }).finished
        .then(() => { label.remove(); p.seatEl.classList.remove('joined'); }));
    }
  }
  return Promise.all(waits);
}

function columnTops() {
  const m = new Map();
  for (const [seat, p] of S.players) if (p.inColumn) m.set(seat, p.slot.getBoundingClientRect().top);
  return m;
}

// FLIP: animate every tile still in the column from where it was to where it is.
function glide(before, delay = 0) {
  const waits = [];
  for (const [seat, p] of S.players) {
    const from = before.get(seat);
    if (!p.inColumn || from === undefined) continue;
    const dy = from - p.slot.getBoundingClientRect().top;
    if (Math.abs(dy) > 1) {
      waits.push(p.slot.animate(
        [{ transform: `translateY(${dy}px)` }, { transform: 'translateY(0)' }],
        { duration: MOVE_MS, delay, fill: 'backwards', easing: 'cubic-bezier(.2,.8,.2,1)' }).finished);
    }
  }
  return waits;
}

const FOLD_KEYFRAMES = [
  { transform: 'translateX(0)',    opacity: 1,   filter: 'grayscale(0)', offset: 0 },
  { transform: 'translateX(0)',    opacity: .85, filter: 'grayscale(1)', offset: .3 },
  { transform: 'translateX(6rem)', opacity: 0,   filter: 'grayscale(1)', offset: 1 },
];

// Folded: lift the tile out of the flow where it stands, grey it, slide it
// right while it fades. Only when that has finished do the tiles below glide up
// (they are held at their old positions until then).
async function foldOut(p) {
  const before = columnTops();
  const box = p.slot.getBoundingClientRect();
  const parent = els.seats.getBoundingClientRect();
  p.inColumn = false;
  Object.assign(p.slot.style, {
    position: 'absolute', margin: '0',
    top: (box.top - parent.top) + 'px', left: (box.left - parent.left) + 'px',
    width: box.width + 'px',
  });
  p.seatEl.classList.remove('active');
  const out = p.slot.animate(FOLD_KEYFRAMES,
    { duration: FOLD_MS, easing: 'ease-in', fill: 'forwards' }).finished;
  await Promise.all([out, ...glide(before, FOLD_MS)]);   // tiles below move only after the fold-out finishes
  p.slot.remove();
}

// ---- tiles phase in once the first hole cards are registered -------------
function showTiles() {
  if (tilesShown) return;
  tilesShown = true;
  const slots = S.order.map(seat => S.players.get(seat)).filter(Boolean).map(p => p.slot);
  slots.forEach(s => { s.style.opacity = '1'; });
  Promise.all(slots.map(s => s.animate(
    [{ opacity: 0, transform: 'translateX(-1.2rem)' }, { opacity: 1, transform: 'translateX(0)' }],
    { duration: PHASE_IN_MS, easing: 'ease-out' }).finished)).then(resolveTiles);
}

// ---- events --------------------------------------------------------------
function startHand(ev) {
  epoch++;
  chain = Promise.resolve();
  tilesShown = false;
  tilesReady = new Promise(r => { resolveTiles = r; });

  S.hand = ev.hand ?? S.hand + 1;
  S.game = GAMES[ev.game] || ev.game || S.game;
  S.blinds = ev.blinds ?? S.blinds;
  S.street = 'preflop';
  S.holes = ev.hole_cards ?? (/plo|omaha/i.test(S.game) ? 4 : 2);
  els.board.replaceChildren();
  els.board.classList.remove('two');
  els.pots.replaceChildren();
  els.outs.replaceChildren();
  S.equity = {};
  S.outs = {};
  S.turnSeat = null;
  outsKey = '';
  els.seats.replaceChildren();
  S.players = new Map();
  for (const p of ev.players) S.players.set(p.seat, { ...p, cards: [] });

  // Column order: small blind on top (seat after the button), button last.
  const seats = [...S.players.keys()].sort((a, b) => a - b);
  if (ev.order) {
    S.order = ev.order.filter(s => S.players.has(s));
  } else {
    const after = seats.filter(s => s > ev.button);
    const upTo = seats.filter(s => s <= ev.button);
    S.order = [...after, ...upTo];
  }
  for (const seat of S.order) els.seats.append(makeSlot(S.players.get(seat)));

  renderInfo();
  if (ev.pots) setPots(ev.pots); else setPot(ev.pot ?? 0);
}

async function revealCards(ev) {
  const my = epoch;
  showTiles();
  await tilesReady;
  const p = S.players.get(ev.seat);
  if (my !== epoch || !p || !p.cardsEl) return;
  p.cards = ev.cards;
  p.cardsEl.replaceChildren(...ev.cards.map(cardEl));
  p.cardsEl.animate(
    [{ opacity: 0, transform: 'scale(.8)' }, { opacity: 1, transform: 'scale(1)' }],
    { duration: CARDS_MS, easing: 'ease-out' });
}

// Win chance on every tile; the leader's number is gold.
function renderEquity() {
  let lead = null;
  for (const [seat, pct] of Object.entries(S.equity)) {
    if (lead === null || pct > S.equity[lead]) lead = seat;
  }
  for (const [seat, p] of S.players) {
    if (!p.equityEl) continue;
    const pct = S.equity[seat];
    p.equityEl.textContent = pct === undefined ? '' : `${Math.round(pct)}%`;
    p.equityEl.classList.toggle('lead', String(seat) === lead);
  }
}

// Outs for the player on action, if they are behind: bottom centre.
let outsKey = '';
function renderOuts() {
  const seat = S.turnSeat;
  const p = seat === null ? null : S.players.get(seat);
  const cards = seat === null ? null : S.outs[seat];
  if (!p || !cards || !cards.length) {
    if (outsKey) els.outs.replaceChildren();
    outsKey = '';
    return;
  }
  const key = `${seat}:${cards.join(',')}`;
  if (key === outsKey) return;
  outsKey = key;

  const title = document.createElement('div');
  title.className = 'outs-title';
  title.textContent = `${p.name || 'Seat ' + seat} · ${cards.length} out${cards.length === 1 ? '' : 's'}`;
  const row = document.createElement('div');
  row.className = 'outs-row';
  row.append(...cards.map(cardEl));
  els.outs.replaceChildren(title, row);
  els.outs.animate([{ opacity: 0, transform: 'translateX(-50%) translateY(.8rem)' },
                    { opacity: 1, transform: 'translateX(-50%) translateY(0)' }],
                   { duration: 300, easing: 'ease-out' });
}

async function doEquity(ev) {
  S.equity = ev.equities || {};
  S.outs = ev.outs || {};
  renderEquity();
  renderOuts();
}

async function doBlind(ev) {
  const p = S.players.get(ev.seat);
  if (!p) return;
  setStack(p, ev.stack);
  applyPot(ev);
  await dropLabel(p, `${ev.kind} $${ev.amount}`, 'blind');
}

async function doTurn(ev) {
  for (const p of S.players.values()) if (p.seatEl) p.seatEl.classList.remove('active');
  const p = S.players.get(ev.seat);
  if (p && p.inColumn) p.seatEl.classList.add('active');
  S.turnSeat = ev.seat;
  renderOuts();
  await sleep(TURN_MS);
}

async function doAction(ev) {
  const p = S.players.get(ev.seat);
  if (!p || !p.inColumn) return;
  const [word, cls] = LABELS[ev.action] || [String(ev.action).toUpperCase(), 'check'];
  const text = ev.amount !== undefined && !['check', 'fold'].includes(ev.action)
    ? `${word} $${ev.amount}` : word;
  setStack(p, ev.stack);
  applyPot(ev);
  if (S.turnSeat === ev.seat) { S.turnSeat = null; renderOuts(); }
  await dropLabel(p, text, cls);
  if (ev.action === 'fold') await foldOut(p);
}

async function doStreet(ev) {
  S.turnSeat = null;
  renderOuts();
  await clearLabels();
  S.street = ev.street;
  renderInfo();
  applyPot(ev);

  // One row per board (two for double-board games). Only the new cards appear,
  // and they cascade in: left to right, and board 2 after board 1.
  const boards = ev.boards || [ev.board];
  els.board.classList.toggle('two', boards.length > 1);
  const waits = [];
  let n = 0;
  boards.forEach((cards, b) => {
    let row = els.board.children[b];
    if (!row) {
      row = document.createElement('div');
      row.className = 'board-row';
      els.board.append(row);
    }
    cards.slice(row.children.length).forEach(code => {
      const el = cardEl(code);
      el.style.opacity = '0';
      row.append(el);
      waits.push(el.animate(
        [{ opacity: 0, transform: 'translateY(-1.2rem)' }, { opacity: 1, transform: 'translateY(0)' }],
        { duration: BOARD_MS, delay: n++ * BOARD_STAGGER_MS, easing: 'ease-out', fill: 'backwards' })
        .finished.then(() => { el.style.opacity = '1'; }));
    });
  });
  await Promise.all(waits);
}

// Dealer pressed Next Hand: count the winners' stacks up, hold the result,
// then discard every remaining tile top to bottom (no action labels).
async function nextHand(ev) {
  await chain;                       // let in-flight animations finish first
  if (!tilesShown) return;
  S.turnSeat = null;
  renderOuts();

  const winners = (ev.winners || [])
    .map(w => {
      const p = S.players.get(w.seat);
      if (!p || !p.stackEl) return null;
      return { p, from: p.stack, to: w.stack !== undefined ? w.stack : p.stack + w.amount };
    })
    .filter(Boolean);

  if (winners.length) {
    setPot(0);
    winners.forEach(w => w.p.stackEl.classList.add('winning'));
    const paint = t => {
      for (const w of winners) {
        w.p.stackEl.textContent = '+$' + (w.from + Math.round((w.to - w.from) * t));
      }
    };
    paint(0);
    const start = performance.now();
    await new Promise(resolve => {
      const timer = setInterval(() => {
        const t = Math.min(1, (performance.now() - start) / PAYOUT_MS);
        paint(t);
        if (t >= 1) { clearInterval(timer); resolve(); }
      }, 4);   // fast enough that the count moves one chip at a time up to ~500
    });

    // Final state: plus sign gone, still bright green for a moment.
    for (const w of winners) { w.p.stack = w.to; w.p.stackEl.textContent = '$' + w.to; }
    await sleep(HOLD_MS);
    winners.forEach(w => w.p.stackEl.classList.remove('winning'));
  }

  // Waterfall: each tile greys out and slides away, a beat after the one above.
  const tiles = S.order.map(seat => S.players.get(seat)).filter(p => p && p.inColumn);
  tiles.forEach(p => { p.inColumn = false; p.seatEl.classList.remove('active'); });
  await Promise.all(tiles.map((p, i) => p.slot.animate(FOLD_KEYFRAMES,
    { duration: FOLD_MS, delay: i * WATERFALL_MS, easing: 'ease-in', fill: 'both' }).finished));
  tiles.forEach(p => p.slot.remove());   // removed together so nothing jumps mid-cascade
}

// One at a time: each queued task waits for the previous one to finish.
function enqueue(task) {
  const my = epoch;
  chain = chain.then(async () => {
    if (my !== epoch) return;
    await tilesReady;
    if (my !== epoch) return;
    await task();
  }).catch(console.error);
}

// Events are applied strictly in arrival order. "next_hand" holds the line
// until its end-of-hand sequence is over, so the following hand_start (and the
// hole cards after it) can't cut in.
let gate = Promise.resolve();
function handle(ev) {
  gate = gate.then(() => dispatch(ev)).catch(console.error);
}

async function dispatch(ev) {
  switch (ev.type) {
    case 'hand_start': startHand(ev); break;
    case 'cards':      revealCards(ev); break;
    case 'blind':      enqueue(() => doBlind(ev)); break;
    case 'turn':       enqueue(() => doTurn(ev)); break;
    case 'action':     enqueue(() => doAction(ev)); break;
    case 'street':     enqueue(() => doStreet(ev)); break;
    case 'equity':     enqueue(() => doEquity(ev)); break;
    case 'next_hand':  await nextHand(ev); break;
  }
}
window.overlay = { handle };

// ---- live mode: events from the engine over WebSocket --------------------
function live(url) {
  let retry = 500;
  const connect = () => {
    const ws = new WebSocket(url);
    ws.onopen = () => { retry = 500; };
    ws.onmessage = e => {
      const data = JSON.parse(e.data);
      (Array.isArray(data) ? data : [data]).forEach(handle);
    };
    ws.onclose = () => { setTimeout(connect, retry); retry = Math.min(retry * 2, 5000); };
  };
  connect();
}

// ---- demo mode: scripted hands, looped -----------------------------------
// Cycles NLH (with a main pot and two side pots), PLO 4-card, and a
// double-board PLO bomb pot. ?game=nlh|plo4|bomb_plo_2brd shows just one.
async function demo() {
  const NAMES = ['Maya', 'Dan', 'Priya', 'Leo', 'Sam', 'Tim H', 'Chris', 'Ava'];
  const STACKS = [412, 188, 530, 95, 260, 740, 300, 720];
  const forced = params.get('game');
  const loop = forced ? [forced] : ['nlh', 'plo4', 'bomb_plo_2brd'];
  let hand = 41, button = 8, round = 0;

  while (true) {
    hand++;
    const game = loop[round++ % loop.length];
    const bomb = game === 'bomb_plo_2brd';
    const holes = game === 'nlh' ? 2 : 4;

    const players = NAMES.map((name, i) => ({ seat: i + 1, name, stack: STACKS[i] }));
    const seats = players.map(p => p.seat);
    const stack = {}, contrib = {}, inStreet = {};
    const folded = new Set();
    players.forEach(p => { stack[p.seat] = p.stack; contrib[p.seat] = 0; });

    const after = seats.filter(s => s > button);
    const order = [...after, ...seats.filter(s => s <= button)];
    const [sb, bb, ...rest] = order;

    // Main pot + side pots from everyone's total contribution; a new pot starts
    // above each all-in player's level.
    const potsNow = () => {
      const live = seats.filter(s => !folded.has(s));
      const caps = [...new Set(live.filter(s => stack[s] === 0 && contrib[s] > 0).map(s => contrib[s]))]
        .sort((a, b) => a - b);
      const top = Math.max(0, ...live.map(s => contrib[s]));
      if (!caps.length || caps[caps.length - 1] < top) caps.push(top);
      const pots = [];
      let prev = 0;
      for (const cap of caps) {
        let amt = 0;
        for (const s of seats) amt += Math.max(0, Math.min(contrib[s], cap) - prev);
        if (amt > 0) pots.push({ amount: amt, eligible: live.filter(s => contrib[s] >= cap) });
        prev = cap;
      }
      return pots.length ? pots : [{ amount: 0 }];
    };
    const put = (seat, amt) => {
      stack[seat] -= amt;
      inStreet[seat] = (inStreet[seat] || 0) + amt;
      contrib[seat] += amt;
    };
    const act = (seat, type, to) => {
      if (type === 'call' && to === undefined) to = Math.max(0, ...Object.values(inStreet));
      let amt = 0;
      if (type === 'all_in') { amt = stack[seat]; to = (inStreet[seat] || 0) + amt; }
      else if (to !== undefined) amt = Math.min(stack[seat], to - (inStreet[seat] || 0));
      put(seat, amt);
      if (type === 'fold') folded.add(seat);
      return { type: 'action', seat, action: type, amount: to, stack: stack[seat], pots: potsNow() };
    };
    const post = (seat, kind, amount) => {
      put(seat, amount);
      return { type: 'blind', seat, kind, amount, stack: stack[seat], pots: potsNow() };
    };
    const step = async (seat, type, to, pause = 1300) => {
      handle({ type: 'turn', seat });
      handle(act(seat, type, to));
      if (type === 'fold') sendEquity();
      await sleep(pause);
    };
    const nextStreet = () => { for (const k in inStreet) delete inStreet[k]; };


    // shuffled deck
    const deck = [];
    for (const r of 'AKQJT98765432') for (const su of 'shdc') deck.push(r + su);
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    const dealt = {};
    seats.forEach((seat, i) => { dealt[seat] = deck.slice(i * holes, (i + 1) * holes); });
    const boardCards = deck.slice(seats.length * holes);
    const boards = bomb ? [boardCards.slice(0, 5), boardCards.slice(5, 10)] : [boardCards.slice(0, 5)];
    const reveal = n => boards.map(b => b.slice(0, n));

    // Illustrative numbers only; the real engine computes true equity and outs.
    let streetNow = 'preflop';
    const sendEquity = () => {
      const live = seats.filter(s => !folded.has(s));
      if (live.length < 2) return;
      const w = live.map(() => 1 + Math.random() * 4);
      const total = w.reduce((a, b) => a + b, 0);
      const equities = {};
      live.forEach((s, i) => { equities[s] = Math.round(w[i] / total * 1000) / 10; });
      const lead = live.reduce((a, b) => (equities[a] >= equities[b] ? a : b));
      const n = { preflop: 0, flop: 3, turn: 4, river: 5 }[streetNow];
      const outs = {};
      if ((n === 3 || n === 4) && boards.length === 1) {
        const used = new Set([...seats.flatMap(s => dealt[s]), ...boards[0].slice(0, n)]);
        const pool = deck.filter(c => !used.has(c));
        live.filter(s => s !== lead && Math.random() < 0.7).forEach(s => {
          outs[s] = pool.slice().sort(() => Math.random() - 0.5).slice(0, 5 + Math.floor(Math.random() * 5));
        });
      }
      handle({ type: 'equity', equities, outs });
    };
    const send = ev => {
      if (ev.type === 'street') streetNow = ev.street;
      handle(ev);
      if (ev.type === 'street') sendEquity();
    };

    handle({ type: 'hand_start', hand, game, blinds: '1/2', button, players, order, pots: [0] });
    await sleep(1200);

    // hole cards register one seat at a time, in no particular order
    for (const n of [3, 1, 5, 2, 7, 4, 8, 6]) {
      handle({ type: 'cards', seat: order[n - 1], cards: dealt[order[n - 1]] });
      await sleep(450);
    }
    sendEquity();
    await sleep(600);

    if (bomb) {
      // bomb pot: everyone antes, no preflop betting, straight to the flop
      for (const seat of order) handle(post(seat, 'ANTE', 5));
      await sleep(order.length * 500 + 400);
      nextStreet();
      send({ type: 'street', street: 'flop', boards: reveal(3), pots: potsNow() });
      await sleep(1600);
      handle({ type: 'turn', seat: sb });
      await sleep(400);
      await step(sb, 'check');
      await step(bb, 'bet', 20);
      await step(rest[0], 'call', 20);
      for (const seat of [...rest.slice(1), sb]) await step(seat, 'fold', undefined, 900);
      nextStreet();
      send({ type: 'street', street: 'turn', boards: reveal(4), pots: potsNow() });
      await sleep(1600);
      await step(bb, 'check');
      await step(rest[0], 'bet', 40);
      await step(bb, 'call', 40);
      nextStreet();
      send({ type: 'street', street: 'river', boards: reveal(5), pots: potsNow() });
      await sleep(2500);
      const total = potsNow()[0].amount;
      handle({ type: 'next_hand', winners: [{ seat: bb, amount: total, stack: stack[bb] + total }] });
    } else {
      // blinds post automatically, then the action lands on UTG
      handle(post(sb, 'SB', 1));
      handle(post(bb, 'BB', 2));
      handle({ type: 'turn', seat: rest[0] });
      await sleep(2200);

      // short stacks shove one after another, building a main pot and two side pots
      await step(rest[0], 'fold');
      await step(rest[1], 'all_in');           // 95
      await step(rest[2], 'call');
      await step(rest[3], 'fold');
      await step(rest[4], 'raise', 260);
      await step(rest[5], 'fold');
      await step(sb, 'fold');
      await step(bb, 'all_in');                // 188
      await step(rest[2], 'all_in');           // 260
      await sleep(800);

      nextStreet();
      send({ type: 'street', street: 'flop', board: boards[0].slice(0, 3), pots: potsNow() });
      await sleep(1600);
      send({ type: 'street', street: 'turn', board: boards[0].slice(0, 4), pots: potsNow() });
      await sleep(1600);
      send({ type: 'street', street: 'river', board: boards[0].slice(0, 5), pots: potsNow() });
      await sleep(2500);

      // each pot goes to a different player
      const pots = potsNow();
      const winnersBySeat = [rest[1], bb, rest[2]];   // smallest stack takes the main pot
      handle({
        type: 'next_hand',
        winners: pots.map((pot, i) => ({
          seat: winnersBySeat[i], amount: pot.amount, stack: stack[winnersBySeat[i]] + pot.amount,
        })),
      });
    }

    button = button % players.length + 1;
  }
}

const wsUrl = params.get('ws');
wsUrl ? live(wsUrl) : demo();
</script>
